version: '3.8'

services:
  db:
    image: postgres:15
    container_name: football_postgres
    environment:
      POSTGRES_DB: football_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  pipeline:
    image: python:3.11-slim
    container_name: football_pipeline
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - API_KEY=${API_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=football_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python main.py"
    restart: no

volumes:
  postgres_data: